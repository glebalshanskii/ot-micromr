[project]
name = "ot-micromr"
version = "0.1.0"
description = "Independent reproduction and empirical evaluation of microstructure mean reversion"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "scipy>=1.18.0",
]

[project.scripts]
ot-micromr = "ot_micromr.cli:main"

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"
