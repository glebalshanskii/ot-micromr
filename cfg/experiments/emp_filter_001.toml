schema_version = "runspec-v1"
experiment_id = "EMP-FILTER-001"
track = "empirical"
mode = "practical-local"
objective = "Fit and audit a strictly causal OKX BTC efficient-price filter on frozen train days without orders or P&L."
claim_ids = ["P6-EMP-CAUSAL-FEASIBILITY", "P6-EMP-UNCERTAINTY-MARGIN"]
orders_enabled = false
claim_eligible = true

[seed_policy]
rng_used = true
rng_algorithm = "torch.Generator:CUDA"
seeds = [202608120200]
mapping = "One master seed drives audit-day particle initialization, transitions and systematic resampling through recorded offsets; fitting is deterministic."

[units]
time = "millisecond"
price = "USDT"
quantity = "contract_or_base_asset_by_instrument"
cash = "USDT"
timezone = "UTC"
normalization = "exact_0.1_USDT_ticks_and_nat_per_compatible_event"

[numerics]
compute_backend = "torch"
compute_device = "cuda"
state_dtype = "float32"
statistics_dtype = "float64"
compile_enabled = true
compile_mode = "reduce-overhead"
archive_workers = 10
torch_threads_per_worker = 1
particle_count = 256
particle_chunk_events = 128
optimizer = "Adam"
optimizer_steps = 400
optimizer_learning_rate = 0.05
nonfinite_policy = "stop"

[inputs]
source_kind = "okx_official_historical_archives"
venue = "OKX"
dataset = "okx-btc-p5-audit-2024-v1"
dataset_version = "v1"
dataset_sha256 = "0e3a6d6e99586b72ccc237bde7f8df4c3651ba4bd4495b391d9a20771c0e3888"
raw_manifest_path = "data/okx/emp_data_001/raw_manifest.json"
source_spec_path = "cfg/experiments/emp_data_001_sources.toml"
source_spec_sha256 = "16036c12ff5813c41f2ebd574b72f06d99ee093a3f78f447e0b1ba9b18426d45"
protocol_path = "docs/protocols/empirical/p6-causal-efficient-price.md"
execution_instrument = "BTC-USDT-SWAP"
reference_instrument = "BTC-USDT"
p5_dependency_run = "EMP-DATA-001/20260811T232210534423Z-45f5a299b7ff-det"
p5_dependency_manifest_sha256 = "3563ab0098613595aa3be1e021b8b39eae784e52b1fe564e3bd88ef86891c121"
synthetic_dependency_run = "FILTER-SYN-001/20260811T234700354892Z-9e7f2939b506-det"
synthetic_dependency_manifest_sha256 = "1d7b42ab7732fdb5b66fb824be0aa713b9a9656ee4af4fda23edc35dd8efd3a2"
synthetic_dependency_filter_digest_sha256 = "c5a1b904e1b3d72e31dbb0f3b958e31ec80d01ae8683ee17e26bcfea12008b13"
train_start_utc = "2024-01-01T00:00:00.000Z"
train_end_utc = "2024-12-31T23:59:59.999Z"
validation_and_test_access = "forbidden"

[model]
enabled = true
price_tick = 0.1
channel_contract = "exact_paper_six_event_transitions_else_segment_reset"
spot_alignment = "searchsorted_right_minus_one"
basis_filter = "causal_irregular_ewma"
basis_time_constant_seconds = 300.0
fit_models = ["balanced", "unbalanced"]
positive_parameterization = "softplus"
selected_model_fallback = "balanced"
particle_initial_scale = "fit_s_g"

[simulation]
enabled = false
reason = "All empirical observations come from frozen OKX train archives."

[strategy]
enabled = false
reason = "P6 estimates latent state and cannot generate thresholds, orders or P&L."

[execution]
enabled = false
reason = "No fills, costs or latency are evaluated in P6."

[evaluation]
fit_date = "2024-01-15"
selection_date = "2024-07-15"
audit_date = "2024-12-15"
descriptive_dates = ["2024-03-15", "2024-05-15", "2024-09-15", "2024-11-15"]
all_swap_dates = [
  "2024-01-15", "2024-03-15", "2024-05-15", "2024-07-15",
  "2024-09-15", "2024-11-15", "2024-12-15",
]
spot_dates = ["2024-01-15", "2024-07-15", "2024-12-15"]
selection_block_minutes = 30
selection_alpha = 0.05
unbalanced_minimum_improvement_nat_per_event = 0.01
reduced_parameter_grid_seconds = 1.0
posterior_interval_nominal_coverage = 0.90
maximum_wall_seconds = 600.0

[acceptance]
require_synthetic_dependency_passed = true
require_zero_future_timestamp_accesses = true
require_deterministic_replay = true
require_all_filter_values_finite = true
require_positive_posterior_variance = true
require_frozen_model_before_audit = true
require_uncertainty_below_option_margin = true
require_clean_tree_for_claim = true
stop_on_nonfinite_value = true

[artifacts]
output_root = "outputs"
required_classes = [
  "source_config",
  "resolved_runspec",
  "manifest",
  "log",
  "metrics_summary",
  "metrics_raw",
  "table",
  "state",
]
optional_classes = []
