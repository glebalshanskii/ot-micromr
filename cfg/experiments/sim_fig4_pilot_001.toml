schema_version = "runspec-v1"
experiment_id = "SIM-FIG4-PILOT-001"
track = "synthetic"
mode = "paper-faithful"
objective = "Pilot gamma coverage, variance, crossing diagnostics and compute for an independent Figure 4 reconstruction."
claim_ids = ["PAPER-FIG4-INWARD-OPTIMUM", "PAPER-FIG4-RATE-LOSS-AT-DAWSON", "PAPER-FIG4-RATE-LOSS-AT-KRAMERS"]
orders_enabled = true
claim_eligible = false

[seed_policy]
rng_used = true
rng_algorithm = "numpy.random.PCG64DXSM"
calibration_seeds = [2026081101, 2026081102, 2026081103, 2026081104, 2026081105, 2026081106]
strategy_seeds = [2026081111, 2026081112, 2026081113, 2026081114, 2026081115, 2026081116]
deterministic_replay_seeds = [2026081111]
mapping = "SeedSequence([seed, response_row_index, epsilon_code]) spawns endpoint, book occurrence, book channel and policy bridge streams."
bootstrap_seed = 2026081197
stream_mapping_version = "figure4_row_resolution_policy_bridge_v2"

[units]
time = "second"
price = "synthetic_price_unit"
quantity = "lot"
cash = "synthetic_quote_currency"
timezone = "UTC"
normalization = "row_specific_alpha_and_calibrated_s_g"

[numerics]
market_float_dtype = "float64"
reduction_float_dtype = "float32"
simulation_algorithm = "adaptive_left_hazard_single_jump_v2"
primary_resolution_epsilon = 0.01
refinement_epsilons = [0.01, 0.005]
max_time_step_rule = "dt_seconds <= epsilon / row_alpha_per_second"
max_event_probability_rule = "1 - exp(-lambda_total_left * dt_seconds) <= epsilon"
bridge_crossing_probability = "exact_one_sided_brownian_bridge"
bridge_probability_cutoff = 1.0e-14
bridge_only_hit_time_rule = "step_midpoint"
omitted_probability_budget = 1.0e-5
root_lower_margin_ratio = 1.0e-12
root_upper_u_ratio = 8.0
root_xtol = 1.0e-13
root_rtol = 1.0e-13
root_max_iterations = 200
cpu_workers = 10
gpu_reduction_enabled = true
gpu_compile_enabled = true
gpu_fallback = "numpy_float64"

[inputs]
source_kind = "paper_model_project_parameters"
paper_version = "arXiv:2608.00885v1"
paper_pdf_sha256 = "fd1a0dfc0d8fc8d7feb26ee23231232ac4263e95a5bb0ef41d18e4c0a8c611ba"
protocol_path = "docs/protocols/synthetic/p4-figure-reconstruction.md"
parameter_provenance = "Project-chosen balanced family; author primitives and simulator are unavailable."
dataset = "not_applicable"
dataset_reason = "Synthetic paper model."

[model]
enabled = true
delta_price = 1.0
sigma_x_price_per_sqrt_second = 1.0
mu_s_per_second = 1.0
mu_o_per_second = 0.01
mu_c_per_second = 2.0
response_scale_alpha_per_second_grid = [0.20, 0.30, 0.40, 0.50, 0.65, 0.80]
alpha_s_fraction_of_alpha = 0.5
alpha_o_fraction_of_alpha = 0.0
alpha_c_fraction_of_alpha = 1.0
balanced_response_rule = "2*alpha_s+alpha_o == alpha_c == alpha"

[model.initial_state]
time_seconds = 0.0
mid_half_ticks = 1
efficient_price = 0.5
inventory_lots = 0
mid_marked_wealth_quote_currency = 0.0
efficient_price_marked_wealth_quote_currency = 0.0
state_representation = "mid_half_ticks_is_canonical"

[simulation]
enabled = true
calibration_burn_in_reversion_times = 50.0
calibration_sampling_reversion_times = 100.0
calibration_observation_interval_reversion_times = 0.02
market_burn_in_reversion_times = 50.0
strategy_burn_in_reversion_times = 50.0
horizon_reversion_times = 300.0
replications = 6
event_log = false
fill_log = false
simultaneous_book_events_allowed = false
strategy_monitoring_enabled = true

[strategy]
enabled = true
policy = "symmetric_flip_band"
threshold_multiplier_theta_over_theta_d_grid = [0.50, 0.60, 0.70, 0.80, 0.90, 1.00, 1.10, 1.20, 1.30, 1.40, 1.50, 1.60]
additional_thresholds = ["theta_star"]
initial_inventory_lots = 0
first_entry_quantity_lots = 1
subsequent_flip_quantity_lots = 2
flat_between_thresholds = false

[execution]
enabled = true
fill_convention = "diffusion_crossing_before_post_book_event_at_displayed_touch"
realized_half_spread_rule = "spread_price_at_fill / 2"
threshold_reference_phi_price = 0.5
contract_multiplier_quote_currency_per_price_lot = 1.0
latency_seconds = 0.0
fee_quote_currency_per_lot = 0.0
slippage_price = 0.0
market_impact_enabled = false
partial_fills_enabled = false
terminal_liquidation = false
wealth_markings = ["mid_marked", "efficient_price_marked"]

[evaluation]
primary_metric = "discrete_grid_optimum_inward_shift_fraction"
target_realized_gamma_ratios = [0.28, 0.36, 0.47]
aggregation = "Mean of seed-level renewal rates; each seed contains the complete response-row and threshold vector."
confidence_interval = "Student-t rate intervals and seed-cluster bootstrap functional intervals."
bootstrap_replications = 1000
familywise_alpha = 0.05
power_target = 0.90
minimum_complete_interfill_intervals_per_seed_and_policy = 1
rate_normalization = "surrogate_row_optimum"
peak_rule = "Lowest-multiplier argmax of across-seed mean rate; local five-point quadratic fit is diagnostic."
rate_loss_rule = "One minus named-threshold seed-mean rate divided by grid-peak seed-mean rate."

[acceptance]
require_all_replications = true
require_all_response_rows = true
require_all_thresholds = true
require_nonflat_before_measurement = true
minimum_complete_interfill_intervals_per_seed_and_policy = 100
invariant_violation_count_max = 0
nonfinite_value_count_max = 0
omitted_probability_sum_max = 1.0e-5
dawson_root_abs_residual_max = 1.0e-10
require_clean_tree_for_claim = false
stop_on_invariant_violation = true
stop_on_nonfinite_value = true
result_label = "pilot_not_claim_eligible"

[artifacts]
output_root = "outputs"
required_classes = ["source_config", "resolved_runspec", "manifest", "log", "metrics_summary", "metrics_raw", "table", "figure_data", "figure", "calibration_table", "fill_log"]
optional_classes = ["event_log"]
