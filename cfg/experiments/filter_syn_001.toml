schema_version = "runspec-v1"
experiment_id = "FILTER-SYN-001"
track = "synthetic"
mode = "oracle-diagnostic"
objective = "Validate a feasible causal six-event particle filter against naive and Kalman controls while using true X only for diagnostics."
claim_ids = ["P6-SYN-STATE-RECOVERY", "P6-SYN-POINT-LOG-SCORE", "P6-SYN-CALIBRATION"]
orders_enabled = false
claim_eligible = false

[seed_policy]
rng_used = true
rng_algorithm = "torch.Generator:CUDA"
seeds = [
  202608120100, 202608120101, 202608120102, 202608120103,
  202608120104, 202608120105, 202608120106, 202608120107,
  202608120108, 202608120109, 202608120110, 202608120111,
  202608120112, 202608120113, 202608120114, 202608120115,
  202608120116, 202608120117, 202608120118, 202608120119,
  202608120120, 202608120121, 202608120122, 202608120123,
  202608120124, 202608120125, 202608120126, 202608120127,
  202608120128, 202608120129, 202608120130, 202608120131,
  202608120132, 202608120133, 202608120134, 202608120135,
  202608120136, 202608120137, 202608120138, 202608120139,
  202608120140, 202608120141, 202608120142, 202608120143,
  202608120144, 202608120145, 202608120146, 202608120147,
  202608120148, 202608120149, 202608120150, 202608120151,
  202608120152, 202608120153, 202608120154, 202608120155,
  202608120156, 202608120157, 202608120158, 202608120159,
  202608120160, 202608120161, 202608120162, 202608120163,
]
mapping = "One independent CUDA generator seed per synthetic session; generator, filter and resampling streams are counter-separated by recorded offsets."

[units]
time = "second"
price = "synthetic_price_unit"
quantity = "lot"
cash = "synthetic_quote_currency"
timezone = "UTC"
normalization = "session_relative_state_error_and_nat_per_book_event"

[numerics]
compute_backend = "torch"
compute_device = "cuda"
state_dtype = "float32"
statistics_dtype = "float64"
compile_enabled = true
compile_mode = "reduce-overhead"
chunk_steps = 50
particle_count = 256
resampling = "systematic_every_fixed_chunk"
resampling_interval_steps = 50
nonfinite_policy = "stop"

[inputs]
source_kind = "paper_model_project_parameters"
paper_version = "arXiv:2608.00885v1"
paper_pdf_sha256 = "fd1a0dfc0d8fc8d7feb26ee23231232ac4263e95a5bb0ef41d18e4c0a8c611ba"
protocol_path = "docs/protocols/empirical/p6-causal-efficient-price.md"
base_experiment_id = "SIM-MOMENTS-002"
oracle_kind = "known_synthetic_efficient_price"
future_access = "oracle_used_only_after_filtering_for_metrics"
dataset = "not_applicable"
dataset_reason = "Synthetic point-process identification experiment."

[model]
enabled = true
delta_price = 1.0
sigma_x_price_per_sqrt_second = 1.0
mu_s_per_second = 1.0
mu_o_per_second = 0.02
mu_c_per_second = 2.0
alpha_s_per_second = 0.4
alpha_o_per_second = 0.2
alpha_c_per_second = 1.0
balanced_response_constraint = "2 * alpha_s + alpha_o = alpha_c"
initial_mid_half_ticks = 1
initial_efficient_price = 0.5
particle_initial_standard_deviation_price = 1.0
kalman_measurement_variance_price_squared = 0.0001

[simulation]
enabled = true
time_step_seconds = 0.005
burn_in_seconds = 50.0
horizon_seconds = 100.0
session_count = 64
maximum_events_per_step = 1
event_occurrence_probability = "1 - exp(-lambda_total_left * dt)"

[strategy]
enabled = false
reason = "P6 estimates latent state and cannot generate orders or P&L."

[execution]
enabled = false
reason = "No fills, costs or latency are evaluated in P6."

[evaluation]
primary_family_id = "P6-SYN-PRIMARY-001"
familywise_alpha = 0.05
multiplicity_method = "bonferroni_two_metrics"
per_metric_alpha = 0.025
power_target = 0.90
state_metric = "one_minus_pf_rmse_over_current_mid_rmse"
state_minimum_effect = 0.10
state_planning_alternative = 0.20
state_planning_session_standard_deviation = 0.20
log_score_metric = "pf_minus_current_mid_predictive_log_score_nat_per_book_event"
log_score_minimum_effect_nat_per_event = 0.01
log_score_planning_alternative_nat_per_event = 0.03
log_score_planning_session_standard_deviation = 0.04
planned_minimum_sessions = 43
planned_sessions = 64
calibration_family_id = "P6-SYN-CALIBRATION-001"
posterior_interval_nominal_coverage = 0.90
posterior_coverage_equivalence_margin = 0.05
calibration_alpha = 0.05
maximum_event_probability = 0.10
maximum_wall_seconds = 180.0

[acceptance]
require_state_superiority = true
require_log_score_superiority = true
require_calibration_equivalence = true
require_oracle_rmse_zero = true
require_deterministic_replay = true
require_clean_tree_for_claim = true
stop_on_nonfinite_value = true

[artifacts]
output_root = "outputs"
required_classes = [
  "source_config",
  "resolved_runspec",
  "manifest",
  "log",
  "metrics_summary",
  "metrics_raw",
  "table",
]
optional_classes = []
