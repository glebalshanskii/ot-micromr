schema_version = "runspec-v1"
experiment_id = "SIM-UNBALANCED-001"
track = "synthetic"
mode = "paper-faithful"
objective = "Verify that a one-factor violation of balanced response produces the preregistered parity drift split."
claim_ids = ["CONTROL-UNBALANCED-PARITY-SPLIT"]
orders_enabled = false
claim_eligible = true

[seed_policy]
rng_used = true
rng_algorithm = "numpy.random.PCG64DXSM"
seeds = [
  2026081101, 2026081102, 2026081103, 2026081104, 2026081105,
  2026081106, 2026081107, 2026081108, 2026081109, 2026081110,
  2026081111, 2026081112, 2026081113, 2026081114, 2026081115,
  2026081116, 2026081117, 2026081118, 2026081119, 2026081120,
]
mapping = "One seed per independent replication; SeedSequence.spawn creates streams in order: brownian_increment, book_occurrence, book_channel, brownian_bridge."
bootstrap_seed = 2026081199
stream_mapping_version = "single_policy_seedsequence_spawn_v1"

[units]
time = "second"
price = "synthetic_price_unit"
quantity = "lot"
cash = "synthetic_quote_currency"
timezone = "UTC"
normalization = "tight_response_alpha_equals_one_unbalanced_control"

[numerics]
float_dtype = "float64"
simulation_algorithm = "adaptive_left_hazard_single_jump_v1"
alpha_ref_per_second = 1.25
primary_resolution_epsilon = 0.01
refinement_epsilons = [0.02, 0.01, 0.005]
max_time_step_rule = "dt_seconds <= epsilon / alpha_ref_per_second"
max_event_probability_rule = "1 - exp(-lambda_total_left * dt_seconds) <= epsilon"
event_probability_formula = "1 - exp(-lambda_total_left * dt_seconds)"
event_type_probability = "lambda_event_left / lambda_total_left"
continuous_crossing_detection = "hybrid_flat_dyadic_tree_and_single_active_boundary_conditional_recursion_v1; dormant because strategy_monitoring is disabled"
crossing_time_approximation = "single-boundary conditioned bisection or flat-entry dyadic polyline, both to maximum leaf width epsilon times step"
flat_entry_tree_depth_rule = "ceil(log2(1 / epsilon))"
event_and_crossing_tie_break = "brownian_crossing_then_book_event_at_equal_timestamp"
observation_boundary_handling = "Precompute the regular schedule; include next_observation_time - t in the adaptive-step minimum; record post-end-state snapshot without interpolation or RNG draws."
invariant_suite_id = "jump_simulator_invariants_v1"
diagnostic_quantile_probabilities = [0.0, 0.25, 0.5, 0.9, 0.95, 0.99, 1.0]

[inputs]
source_kind = "paper_model_project_parameters"
paper_version = "arXiv:2608.00885v1"
paper_pdf_sha256 = "fd1a0dfc0d8fc8d7feb26ee23231232ac4263e95a5bb0ef41d18e4c0a8c611ba"
protocol_path = "docs/protocols/synthetic/paper-reproduction.md"
parameter_provenance = "Preregistered one-factor negative control; alpha_c alone differs from SIM-MOMENTS-001."
experiment_role = "extension_negative_control"
base_experiment_id = "SIM-MOMENTS-001"
dataset = "not_applicable"
dataset_reason = "The path is generated from the synthetic paper model."

[model]
enabled = true
delta_price = 1.0
sigma_x_price_per_sqrt_second = 0.5
mu_s_per_second = 1.0
mu_o_per_second = 0.01
mu_c_per_second = 2.0
alpha_s_per_second = 0.5
alpha_o_per_second = 0.0
alpha_c_per_second = 1.25
tight_drift_coefficient_per_second = 1.0
open_drift_coefficient_per_second = 1.25
one_factor_change = "alpha_c_per_second: 1.0 -> 1.25; every other primitive is identical to SIM-MOMENTS-001"

[model.initial_state]
time_seconds = 0.0
mid_half_ticks = 1
efficient_price = 0.5
inventory_lots = 0
mid_marked_wealth_quote_currency = 0.0
efficient_price_marked_wealth_quote_currency = 0.0
state_representation = "mid_half_ticks_is_canonical; bid, spread, mid and gap are derived"
derived_bid_price_assertion = 0.0
derived_spread_price_assertion = 1.0
derived_mid_price_assertion = 0.5
derived_gap_price_assertion = 0.0

[simulation]
enabled = true
burn_in_reversion_times = 100.0
horizon_reversion_times = 2000.0
reference_reversion_rate_per_second = 1.0
replications = 20
event_log = true
observation_interval_reversion_times = 0.01
simultaneous_book_events_allowed = false
strategy_monitoring_enabled = false

[strategy]
enabled = false
reason = "This is a dynamics negative control; no strategy orders are generated."

[execution]
enabled = false
reason = "No strategy orders are generated."

[evaluation]
primary_metric = "finite_h_parity_drift_slope_contrast_per_second"
metrics = [
  "invariant_violation_count",
  "generator_drift_slope_tight_per_second",
  "generator_drift_slope_open_per_second",
  "generator_drift_abs_residual_by_parity",
  "finite_h_conditional_drift_slope_tight_per_second",
  "finite_h_conditional_drift_slope_open_per_second",
  "finite_h_parity_drift_slope_contrast_per_second",
  "open_occupancy",
  "step_size_quantiles_seconds",
  "lambda_total_right_times_step_quantiles",
  "maximum_left_event_probability",
]
aggregation = "Mean across 20 independent seed-level estimates."
confidence_interval = "One-sided 95 percent Student-t interval for the seed-level finite-h parity contrast."
multiplicity = "One preregistered directional contrast; generator checks are deterministic identities."
sampling_rule = "Equal-spaced post-burn-in observations; left-state parity defines each sample."
generator_drift_estimator = "Within each parity, OLS through origin of sum_j(lambda_j * delta_mid_j) on G at accepted left states."
finite_h_drift_estimator = "Within each seed and left-state parity, OLS through origin of (G[t+h]-G[t])/h on G[t], h=0.01 reference reversion times."
finite_h_contrast = "beta_tight - beta_open; a positive value means stronger mean reversion in the open state."
minimum_observations_per_seed_and_parity_for_slope = 200
resolution_difference_se = "sqrt(se_epsilon_0_01_squared + se_epsilon_0_005_squared); equal seed labels are not treated as paired."

[acceptance]
invariant_violation_count_max = 0
generator_tight_drift_slope_abs_error_max = 1.0e-10
generator_open_drift_slope_abs_error_max = 1.0e-10
generator_drift_abs_residual_max = 1.0e-12
finite_h_parity_contrast_one_sided_95_percent_lower_bound_min_per_second = 0.05
refinement_primary_metric_abs_difference_max_per_second = 0.02
refinement_threshold_may_be_replaced_by_difference_se = true
refinement_difference_se_rule = "sqrt(se_epsilon_0_01_squared + se_epsilon_0_005_squared)"
require_all_20_replications = true
require_clean_tree_for_claim = true
stop_on_invariant_violation = true
stop_on_nonfinite_value = true

[artifacts]
output_root = "outputs"
required_classes = [
  "source_config",
  "resolved_runspec",
  "manifest",
  "log",
  "metrics_summary",
  "metrics_raw",
  "table",
  "figure_data",
  "figure",
  "event_log",
]
optional_classes = []
