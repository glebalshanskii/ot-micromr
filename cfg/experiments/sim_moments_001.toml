schema_version = "runspec-v1"
experiment_id = "SIM-MOMENTS-001"
track = "synthetic"
mode = "paper-faithful"
objective = "Test parity, balanced drift, stationarity, variance, covariance and open-flow identities on a project-chosen instance of the paper model."
claim_ids = [
  "PAPER-FACT1-PARITY-LOCK",
  "PAPER-2.9-OPEN-FLOW-BALANCE",
  "PAPER-2.12-BALANCED-DRIFT",
  "PAPER-2.14-STATIONARY-MOMENTS",
]
orders_enabled = false
claim_eligible = true

[seed_policy]
rng_used = true
rng_algorithm = "numpy.random.PCG64DXSM"
seeds = [
  2026081101, 2026081102, 2026081103, 2026081104, 2026081105,
  2026081106, 2026081107, 2026081108, 2026081109, 2026081110,
  2026081111, 2026081112, 2026081113, 2026081114, 2026081115,
  2026081116, 2026081117, 2026081118, 2026081119, 2026081120,
]
mapping = "One seed per independent replication; SeedSequence.spawn creates streams in order: brownian_increment, book_occurrence, book_channel, brownian_bridge."
bootstrap_seed = 2026081199
stream_mapping_version = "single_policy_seedsequence_spawn_v1"

[units]
time = "second"
price = "synthetic_price_unit"
quantity = "lot"
cash = "synthetic_quote_currency"
timezone = "UTC"
normalization = "alpha_equals_one_reference_instance"

[numerics]
float_dtype = "float64"
simulation_algorithm = "adaptive_left_hazard_single_jump_v1"
alpha_ref_per_second = 1.0
primary_resolution_epsilon = 0.01
refinement_epsilons = [0.02, 0.01, 0.005]
max_time_step_rule = "dt_seconds <= epsilon / alpha_per_second"
max_event_probability_rule = "1 - exp(-lambda_total_left * dt_seconds) <= epsilon"
event_probability_formula = "1 - exp(-lambda_total_left * dt_seconds)"
event_type_probability = "lambda_event_left / lambda_total_left"
continuous_crossing_detection = "hybrid_flat_dyadic_tree_and_single_active_boundary_conditional_recursion_v1; dormant because strategy_monitoring is disabled"
crossing_time_approximation = "single-boundary conditioned bisection or flat-entry dyadic polyline, both to maximum leaf width epsilon times step"
flat_entry_tree_depth_rule = "ceil(log2(1 / epsilon))"
event_and_crossing_tie_break = "brownian_crossing_then_book_event_at_equal_timestamp"
observation_boundary_handling = "Precompute the regular schedule; include next_observation_time - t in the adaptive-step minimum; record post-end-state snapshot without interpolation or RNG draws."
invariant_suite_id = "jump_simulator_invariants_v1"
diagnostic_quantile_probabilities = [0.0, 0.25, 0.5, 0.9, 0.95, 0.99, 1.0]

[inputs]
source_kind = "paper_model_project_parameters"
paper_version = "arXiv:2608.00885v1"
paper_pdf_sha256 = "fd1a0dfc0d8fc8d7feb26ee23231232ac4263e95a5bb0ef41d18e4c0a8c611ba"
protocol_path = "docs/protocols/synthetic/paper-reproduction.md"
parameter_provenance = "Project-chosen normalized baseline; author parameters are unavailable."
dataset = "not_applicable"
dataset_reason = "The path is generated from the synthetic paper model."

[model]
enabled = true
delta_price = 1.0
sigma_x_price_per_sqrt_second = 0.5
mu_s_per_second = 1.0
mu_o_per_second = 0.01
mu_c_per_second = 2.0
alpha_s_per_second = 0.5
alpha_o_per_second = 0.0
alpha_c_per_second = 1.0
alpha_per_second = 1.0
balanced_response_constraint = "2 * alpha_s_per_second + alpha_o_per_second == alpha_c_per_second == alpha_per_second"

[model.initial_state]
time_seconds = 0.0
mid_half_ticks = 1
efficient_price = 0.5
inventory_lots = 0
mid_marked_wealth_quote_currency = 0.0
efficient_price_marked_wealth_quote_currency = 0.0
state_representation = "mid_half_ticks_is_canonical; bid, spread, mid and gap are derived"
derived_bid_price_assertion = 0.0
derived_spread_price_assertion = 1.0
derived_mid_price_assertion = 0.5
derived_gap_price_assertion = 0.0

[simulation]
enabled = true
burn_in_reversion_times = 100.0
horizon_reversion_times = 2000.0
replications = 20
event_log = true
observation_interval_reversion_times = 0.01
simultaneous_book_events_allowed = false
strategy_monitoring_enabled = false

[strategy]
enabled = false
reason = "This experiment validates uncontrolled model dynamics and stationary identities."

[execution]
enabled = false
reason = "No strategy orders are generated."

[evaluation]
primary_metric = "stationary_variance_identity_relative_error"
metrics = [
  "invariant_violation_count",
  "parity_violation_count",
  "illegal_transition_count",
  "negative_intensity_count",
  "nonzero_inactive_intensity_count",
  "nonfinite_value_count",
  "multiple_book_event_step_count",
  "deterministic_replay_mismatch_count",
  "generator_drift_abs_residual_by_parity",
  "stationary_mean_gap",
  "stationary_variance_gap",
  "jump_variance_rate",
  "stationary_variance_identity_signed_relative_residual",
  "stationary_variance_identity_relative_error",
  "finite_h_conditional_drift_slope_by_parity",
  "binned_finite_h_conditional_drift_diagnostic",
  "acf_by_lag",
  "open_occupancy",
  "open_close_flow_signed_relative_residual",
  "open_close_flow_relative_error",
  "step_size_quantiles_seconds",
  "lambda_total_right_times_step_quantiles",
  "maximum_left_event_probability",
  "step_count",
  "book_event_count",
  "event_step_fraction",
  "bridge_only_crossing_count",
  "multiple_crossing_refinement_count",
]
aggregation = "Compute signed/normalized seed-level estimates first, then take their arithmetic mean; reported equality error is the absolute mean signed residual, not the mean absolute residual."
confidence_interval = "two_sided_student_t_95_percent_across_seed_level_estimates"
multiplicity = "centered_studentized_max_t_seed_cluster_bootstrap_for_two_parity_slopes_and_six_acf_lags"
bootstrap_replications = 10000
sampling_rule = "Equal-spaced post-burn-in samples; every seed has equal weight in reported means and inference."
stationary_variance_estimator = "Population second central moment of the equal-spaced samples within each seed."
stationary_mean_normalization = "Within each seed divide mean gap by the square root of that seed's stationary variance; report the arithmetic mean across seeds."
jump_variance_rate_estimator = "Sum of squared book-mid jumps during the measured interval divided by measured seconds."
variance_identity_signed_relative_residual = "Within each seed: (var_gap - (sigma_x_squared + jump_variance_rate) / (2 * alpha)) / ((sigma_x_squared + jump_variance_rate) / (2 * alpha)); reported error is abs(mean seed residual)."
open_close_flow_signed_relative_residual = "Within each seed: 2 * (occupancy_odds - conditional_intensity_odds) / (abs(occupancy_odds) + abs(conditional_intensity_odds)); reported error is abs(mean seed residual)."
finite_h_drift_estimator = "For each seed and left-state parity, OLS through origin of (G[t+h]-G[t])/h on G[t] at h=observation_interval."
finite_h_drift_target_per_second = "(exp(-alpha_per_second * h_seconds) - 1) / h_seconds"
generator_drift_check = "At every accepted left state, sum_j(lambda_j * delta_mid_j) + alpha_per_second * gap_price must vanish in each parity."
binned_drift_role = "Descriptive finite-h diagnostic only; bins use pooled observations and do not replace the parity-slope gate."
drift_gap_bin_scaling = "Scale each observation by the stationary s_g estimated within its seed before pooling observations into fixed bins."
acf_estimator = "Within-seed sample autocovariance about that seed's sample mean, divided by lag-zero sample variance."
simultaneous_interval_construction = "Resample complete centered seed estimate vectors; studentize each coordinate in each resample; use the 0.95 quantile of the maximum absolute t statistic."
resolution_difference_se = "sqrt(se_epsilon_0_01_squared + se_epsilon_0_005_squared); same seed labels are not treated as paired."
drift_gap_bin_edges_s_g = [-3.0, -2.0, -1.5, -1.0, -0.5, 0.0, 0.5, 1.0, 1.5, 2.0, 3.0]
acf_lags_reversion_times = [0.25, 0.5, 1.0, 2.0, 3.0, 5.0]
minimum_pooled_observations_per_drift_bin_and_parity = 1000
minimum_observations_per_seed_and_parity_for_slope = 200
refinement_metrics = [
  "stationary_mean_gap_over_s_g",
  "stationary_variance_identity_signed_relative_residual",
  "open_close_flow_signed_relative_residual",
  "finite_h_drift_slope_over_target_tight",
  "finite_h_drift_slope_over_target_open",
  "acf_at_each_preregistered_lag",
]

[acceptance]
parity_violation_count_max = 0
illegal_transition_count_max = 0
negative_intensity_count_max = 0
nonzero_inactive_intensity_count_max = 0
invariant_violation_count_max = 0
nonfinite_value_count_max = 0
multiple_book_event_step_count_max = 0
deterministic_replay_mismatch_count_max = 0
generator_drift_abs_residual_max = 1.0e-12
stationary_mean_gap_abs_over_s_g_max = 0.02
stationary_variance_identity_relative_error_max = 0.03
open_close_flow_relative_error_max = 0.03
conditional_drift_slope_relative_error_max = 0.05
require_theoretical_drift_slopes_inside_simultaneous_95_percent_interval = true
require_theoretical_acf_inside_simultaneous_95_percent_interval = true
refinement_each_metric_abs_difference_max = 0.01
refinement_threshold_may_be_replaced_by_difference_se = true
refinement_difference_se_rule = "sqrt(se_epsilon_0_01_squared + se_epsilon_0_005_squared)"
require_all_20_replications = true
require_clean_tree_for_claim = true
stop_on_invariant_violation = true
stop_on_nonfinite_value = true

[artifacts]
output_root = "outputs"
required_classes = [
  "source_config",
  "resolved_runspec",
  "manifest",
  "log",
  "metrics_summary",
  "metrics_raw",
  "table",
  "figure_data",
  "figure",
  "event_log",
]
optional_classes = []
